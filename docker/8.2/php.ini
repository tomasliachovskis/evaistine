[PHP]
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS
pcov.directory = .

; Opcache has no business being on in local dev: with --no-reload's
; long-lived php -S workers (see docker-compose.yml), a worker compiles each
; file once and (depending on validate_timestamps/revalidate_freq timing)
; can keep serving that stale compiled version for its entire process
; lifetime — confirmed live 2026-09-14: a worker kept executing pre-fix
; KeywordPageService logic for hours after the file on disk had already
; been fixed and re-verified correct via CLI (which never hit this, since
; opcache.enable_cli is already off) — only a full container restart
; (fresh worker processes) made the running code match the file on disk.
; Every request recompiling from source is the correct dev tradeoff.
opcache.enable = 0
opcache.enable_cli = 0
