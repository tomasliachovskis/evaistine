[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Laravel scheduler (added 2026-10-13). Production gets its data from this
; machine: the dev-only scrapers:run --all (03:00), flyers:scrape --all (05:00),
; hours:scrape and scrapers:fetch-eans (00:30) only fire while this runs.
; They POST to SCRAPER_API_URL from .env (production), see docs/evaistine.md.
; HOME: supervisord runs as root and keeps HOME=/root for user=sail, so
; Chrome could not start (first night, 2026-10-14: every Puppeteer leaflet
; scraper failed with "mkdir: cannot create directory '/root'").
[program:scheduler]
command=/usr/bin/php /var/www/html/artisan schedule:work
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1",HOME="/home/sail",USER="sail"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; No queue worker programs here — local dev doesn't run background queue
; workers by default. Production has dedicated ones (see
; deploy/supervisor-evaistine-flyers.conf and
; deploy/supervisor-evaistine-discounts.conf); run `sail artisan queue:work
; redis --queue=<name>` manually here when you actually need to process a
; queued job locally.
