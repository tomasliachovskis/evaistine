[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; No queue worker programs here — local dev doesn't run background queue
; workers by default. Production has dedicated ones (see
; deploy/supervisor-nuolaidos-flyers.conf and
; deploy/supervisor-nuolaidos-discounts.conf); run `sail artisan queue:work
; redis --queue=<name>` manually here when you actually need to process a
; queued job locally.
