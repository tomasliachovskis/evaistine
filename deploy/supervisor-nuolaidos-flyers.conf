; Queue worker for the "flyers" queue (ProcessStoreFlyerPagesJob and
; ProcessStoreFlyerDiscountsJob/ProcessStoreFlyerPagesJob call $this->onQueue('flyers') — FinalizeScrapedStoresJob
; moved to its own "discounts" queue/worker, see
; supervisor-nuolaidos-discounts.conf, so it never waits behind a slow leaflet
; here).
; Mirrors the local Sail [program:queue-flyers] entry in docker/8.2/supervisord.conf.
; Program name "nuolaidos-flyers" must match what deploy.sh's
; `sudo supervisorctl restart nuolaidos-flyers` expects.
;
; Install: sudo cp deploy/supervisor-nuolaidos-flyers.conf /etc/supervisor/conf.d/nuolaidos-flyers.conf
;          sudo supervisorctl reread && sudo supervisorctl update

[program:nuolaidos-flyers]
command=php /var/www/api/artisan queue:work redis --queue=flyers --sleep=3 --tries=1 --timeout=0
directory=/var/www/api
user=deploy
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/www/api/storage/logs/queue-flyers.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/www/api/storage/logs/queue-flyers-error.log
stderr_logfile_maxbytes=10MB
