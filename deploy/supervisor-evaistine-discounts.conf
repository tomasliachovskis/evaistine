; Dedicated queue worker for the "discounts" queue (FinalizeScrapedStoresJob
; only) — split out from "flyers" so this job (finalizes scraped data into
; live discounts, dispatched every 5 min by discounts:dispatch-store-
; processing) never has to wait behind a slow/retrying leaflet PDF on the
; evaistine-flyers worker (ProcessPdfFlyerJob/ProcessStoreFlyerPagesJob can
; take minutes per page on Gemini vision calls, and Laravel can't preempt an
; in-flight job on the same worker).
; Mirrors the local Sail [program:queue-discounts] entry in
; docker/8.2/supervisord.conf. Program name "evaistine-discounts" is what
; deploy.sh's queue:restart signal reaches via supervisor's autorestart.
;
; Install: sudo cp deploy/supervisor-evaistine-discounts.conf /etc/supervisor/conf.d/evaistine-discounts.conf
;          sudo supervisorctl reread && sudo supervisorctl update

[program:evaistine-discounts]
command=php /var/www/api/artisan queue:work redis --queue=discounts --sleep=3 --tries=1 --timeout=0
directory=/var/www/api
user=deploy
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/www/api/storage/logs/queue-discounts.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/www/api/storage/logs/queue-discounts-error.log
stderr_logfile_maxbytes=10MB
