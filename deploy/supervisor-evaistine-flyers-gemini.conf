; Queue worker for the "flyers-gemini" queue — Gemini discount extraction
; only (ProcessStoreFlyerDiscountsJob). Split out from the "flyers" queue
; (deploy/supervisor-evaistine-flyers.conf, now page-splitting only,
; numprocs=2) on 2026-09-18, by deliberate choice: page-splitting jobs may
; run 2 at a time, but Gemini extraction stays capped at exactly 1
; concurrent job regardless — numprocs=1 here, on purpose, not raised
; alongside the other queue.
;
; Install: sudo cp deploy/supervisor-evaistine-flyers-gemini.conf /etc/supervisor/conf.d/evaistine-flyers-gemini.conf
;          sudo supervisorctl reread && sudo supervisorctl update

[program:evaistine-flyers-gemini]
command=php /var/www/evaistine/artisan queue:work redis --queue=flyers-gemini --sleep=3 --tries=1 --timeout=0
directory=/var/www/evaistine
user=deploy
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/www/evaistine/storage/logs/queue-flyers-gemini.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/www/evaistine/storage/logs/queue-flyers-gemini-error.log
stderr_logfile_maxbytes=10MB
