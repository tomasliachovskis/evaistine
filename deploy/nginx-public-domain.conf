# Public-domain vhost for the merged Blade/Alpine/Livewire frontend+API app.
# Replaces the separate Next.js (PM2, port 3000) vhost that used to proxy the
# public domain to /var/www/nuolaidos-front — now the public domain is served
# directly from this repo's public/ like the existing :8080 API-only vhost.
#
# Swapping the live public-domain vhost to this config is a manual, one-time
# server-side step (Phase 7 cutover) — deploy.sh does not do this automatically.
# Fill in the real domain below and reconcile with however TLS is currently
# terminated for it (certbot typically rewrites a plain :80 block like this
# one into a :443 server block + redirect; this file intentionally mirrors
# nginx-8080-nossl.conf's bare-HTTP shape rather than guessing at certs).
server {
    listen 80;
    listen [::]:80;
    server_name superakcijos.lt www.superakcijos.lt; # TODO: confirm exact domain(s) before use

    root /var/www/api/public;
    index index.php index.html;

    client_max_body_size 64m;

    access_log /var/log/nginx/superakcijos-access.log;
    error_log /var/log/nginx/superakcijos-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Vite-built assets — long-lived cache, matches the immutable hashed filenames.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
