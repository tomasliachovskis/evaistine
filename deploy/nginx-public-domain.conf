# Public-domain vhost for the merged Blade/Alpine/Livewire frontend+API app.
# This is the actual config live on the prod box (84.247.186.143, file
# /etc/nginx/sites-available/api) as of the 2026-08-31 cutover — kept here
# so the repo has one source of truth for it. TLS is terminated by
# Cloudflare (orange-cloud proxied) ahead of this box, not here — this
# server only ever sees plain HTTP from Cloudflare's edge. If Cloudflare's
# SSL mode is ever upgraded from "Flexible" to "Full"/"Full (Strict)", this
# file would need a :443 server block + a Cloudflare Origin CA cert.

# Cloudflare's IP ranges (restores the real visitor IP into $remote_addr /
# X-Forwarded-For instead of Cloudflare's edge IP — check
# https://www.cloudflare.com/ips/ occasionally in case the list changes).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name superakcijos.lt;

    root /var/www/api/public;
    index index.php index.html;

    client_max_body_size 64m;
    server_tokens off;

    access_log /var/log/nginx/api-access.log;
    error_log /var/log/nginx/api-error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Vite-built assets — long-lived cache, matches the immutable hashed
    # filenames.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Store/category logos and other static assets — cache, but not
    # immutable (filenames aren't content-hashed, could change in place).
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 80;
    server_name www.superakcijos.lt;
    return 301 https://superakcijos.lt$request_uri;
}
