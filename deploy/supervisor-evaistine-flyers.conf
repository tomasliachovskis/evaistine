; Queue worker for the "flyers" queue — PDF-to-JPG/WebP page-splitting only
; (ProcessStoreFlyerPagesJob). Gemini discount extraction
; (ProcessStoreFlyerDiscountsJob) moved to its own single-worker
; "flyers-gemini" queue, see supervisor-evaistine-flyers-gemini.conf — by
; deliberate choice (2026-09-18) page-splitting gets 2 parallel workers
; here, Gemini extraction stays capped at exactly 1, and neither queue's
; worker count affects the other. FinalizeScrapedStoresJob is separate
; again, on its own "discounts" queue/worker, see
; supervisor-evaistine-discounts.conf.
; Mirrors the local Sail [program:queue-flyers] entry in docker/8.2/supervisord.conf.
; Program name "evaistine-flyers" must match what deploy.sh's
; `sudo supervisorctl restart evaistine-flyers` expects.
;
; numprocs=2: a single-worker queue meant one slow/huge PDF (confirmed live
; 2026-09-18 — Oriflame's 148-page, 47MB monthly catalog, ~114s/page at 150
; DPI = ~4.7h total) blocked every other queued flyer behind it for that
; entire time, even fast/small ones. Two workers (ProcessStoreFlyerPagesJob
; is ShouldBeUnique per flyer_id, so this parallelizes across DIFFERENT
; flyers, never the same one twice) mean a stuck big catalog can't fully
; stall the queue — at most it ties up one of the two lanes. Picked 2, not
; higher, because the server has only 3 CPU cores (`nproc`) shared with the
; "flyers-gemini" and "discounts" workers, PHP-FPM, MySQL and Redis — each
; Imagick PDF-to-image conversion at 150 DPI is CPU/memory-heavy, so more
; lanes would mean more simultaneous heavy jobs contending for the same 3
; cores rather than genuinely finishing faster.
;
; Install: sudo cp deploy/supervisor-evaistine-flyers.conf /etc/supervisor/conf.d/evaistine-flyers.conf
;          sudo supervisorctl reread && sudo supervisorctl update

[program:evaistine-flyers]
command=php /var/www/evaistine/artisan queue:work redis --queue=flyers --sleep=3 --tries=1 --timeout=0
process_name=%(program_name)s_%(process_num)02d
numprocs=2
directory=/var/www/evaistine
user=deploy
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/www/evaistine/storage/logs/queue-flyers_%(process_num)02d.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/www/evaistine/storage/logs/queue-flyers-error_%(process_num)02d.log
stderr_logfile_maxbytes=10MB
