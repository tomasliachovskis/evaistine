; Raised for /api/scrapers/store-flyer's multipart PDF uploads (the backend's
; own validation caps at 60MB; nginx client_max_body_size is 64m). PHP-FPM's
; defaults on the shared server (post_max_size=8M, upload_max_filesize=2M)
; dropped any leaflet over 2MB: Laravel saw no file, validation redirected
; (302) and the scraper got HTML back (2026-10-13). .user.ini, not php.ini, so
; it applies to this site only, without sudo; PHP rereads it within
; user_ini.cache_ttl (300 s). Same values as superakcijos' server-only copy.
post_max_size = 70M
upload_max_filesize = 70M
