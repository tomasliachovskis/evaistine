# For more information: https://laravel.com/docs/sail
version: '3'
services:
    laravel.test:
        build:
            context: ./docker/8.2
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.2/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            # PHP's built-in dev server (php artisan serve, what Sail actually
            # runs) is single-threaded by default: one slow/looping request
            # blocks every other request, including your own testing. Since
            # PHP 7.4, this env var makes it pre-fork worker processes (needs
            # pcntl, confirmed enabled in this image) so requests actually run
            # concurrently, without switching to nginx+php-fpm. A single page
            # (e.g. a keyword listing page) fires 70+ static-asset requests
            # (store logos, category icons) that all queue behind this same
            # worker pool even though each is a trivial static file.
            #
            # IMPORTANT: Laravel's ServeCommand silently forces this back to
            # 1 worker unless --no-reload is passed (its auto-restart-on-.env-
            # change feature is mutually exclusive with pre-forked workers —
            # see vendor/laravel/framework/.../ServeCommand.php's initialize()).
            # SUPERVISOR_PHP_COMMAND below adds --no-reload for exactly this
            # reason; don't drop it or this env var silently does nothing again.
            PHP_CLI_SERVER_WORKERS: '${PHP_CLI_SERVER_WORKERS:-8}'
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan serve --host=0.0.0.0 --port=80 --no-reload'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
            - mailhog
            - meilisearch
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: "%"
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
            - './docker/mysql/20-native-password.sh:/docker-entrypoint-initdb.d/20-native-password.sh'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s
    mailhog:
        image: 'mailhog/mailhog:latest'
        ports:
            - '${FORWARD_MAILHOG_PORT:-1025}:1025'
            - '${FORWARD_MAILHOG_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    # Keyword pages map their products through Meilisearch (keywords:
    # map-products), and site search reads it, so dev runs its own instance.
    # Same major version as meilisearch/meilisearch-php in composer.lock.
    meilisearch:
        image: 'getmeili/meilisearch:v1.16'
        ports:
            - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
        environment:
            MEILI_MASTER_KEY: '${MEILISEARCH_KEY}'
            MEILI_NO_ANALYTICS: 'true'
            MEILI_ENV: development
        volumes:
            - 'sail-meilisearch:/meili_data'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-meilisearch:
        driver: local
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
